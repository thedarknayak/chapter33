    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f5ead8;
            color: #1a1a1a;
            font-family: 'EB Garamond', 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        .corner-floral { position: fixed; width: 230px; pointer-events: none; z-index: 0; }
        .top-left-floral { top: 0; left: 0; }
        .top-right-floral { top: 0; right: 0; transform: scaleX(-1); }

        .wrapper { width: 100%; max-width: 900px; margin: 0 auto; z-index: 1; position: relative; }
        
        /* Masks Image enlarged by 50% */
        .header-masks img {
            width: 188px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.12));
        }

        h1 { font-size: 2.4rem; font-weight: 600; margin-bottom: 8px; }
        p.subtitle { font-size: 1.05rem; color: #333333; margin-bottom: 38px; }

        .stage-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 65px; position: relative; }

        .book-container {
            width: 280px; 
            height: 330px; 
            background: #f3ede2;
            border: 1px solid #dcd3c1; 
            border-radius: 6px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.10);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 40px;
            z-index: 1;
        }
        .book-author { font-size: 0.85rem; letter-spacing: 3px; color: #b0934c; margin-bottom: 20px; text-transform: uppercase; }
        .book-title { font-size: 1.9rem; font-weight: 700; color: #caaa5d; letter-spacing: 2.5px; margin-bottom: 18px; text-transform: uppercase; }
        .book-vol { font-size: 0.8rem; color: #b0934c; letter-spacing: 2px; text-transform: uppercase; }

        /* Restored Countdown Position onto blank cover area */
        .countdown-grid { 
            display: flex; 
            gap: 16px; 
            margin-top: -165px; 
            z-index: 2; 
            justify-content: center; 
            width: 100%;
        }
        .time-box { 
            background: #caaa5d; 
            color: #1a1a1a;
            width: 132px; 
            height: 132px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.18); 
        }
        .number { font-size: 2.9rem; font-weight: 700; margin-bottom: 8px; line-height: 1; }
        .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.8px; font-weight: 700; }

        .footer-text { font-size: 1.08rem; color: #222222; line-height: 1.7; margin-top: 38px; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .corner-floral { width: 130px; }
            .header-masks img { width: 142px; }
            .book-container { width: 230px; height: 290px; padding-top: 30px; }
            .book-title { font-size: 1.4rem; }
            .countdown-grid { 
                flex-wrap: wrap; 
                max-width: 360px; 
                gap: 12px; 
                margin-top: -115px; 
                justify-content: center; 
            }
            .time-box { width: 104px; height: 100px; }
            .time-box:nth-child(4), .time-box:nth-child(5) { flex: 0 0 104px; }
            .number { font-size: 2.15rem; }
            .label { font-size: 0.65rem; }
        }
    </style>
</head>
