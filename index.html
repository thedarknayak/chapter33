<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 33: Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f5ead8;
            color: #1a1a1a;
            font-family: 'EB Garamond', 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        .corner-floral { position: fixed; width: 230px; pointer-events: none; z-index: 0; }
        .top-left-floral { top: 0; left: 0; }
        .top-right-floral { top: 0; right: 0; transform: scaleX(-1); }

        .wrapper { width: 100%; max-width: 900px; margin: 0 auto; z-index: 1; position: relative; }
        
        /* Masks Image 50% larger */
        .header-masks img {
            width: 188px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.12));
        }

        h1 { font-size: 2.4rem; font-weight: 600; margin-bottom: 8px; }
        p.subtitle { font-size: 1.05rem; color: #333333; margin-bottom: 38px; }

        .stage-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 65px; position: relative; }

        .book-container {
            width: 280px; 
            height: 330px; 
            background: #f3ede2;
            border: 1px solid #dcd3c1; 
            border-radius: 6px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.10);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 40px;
            position: relative;
            z-index: 1;
        }
        .book-author { font-size: 0.85rem; letter-spacing: 3px; color: #b0934c; margin-bottom: 20px; text-transform: uppercase; }
        .book-title { font-size: 1.9rem; font-weight: 700; color: #caaa5d; letter-spacing: 2.5px; margin-bottom: 18px; text-transform: uppercase; }
        .book-vol { font-size: 0.8rem; color: #b0934c; letter-spacing: 2px; text-transform: uppercase; }

        /* Fixed Countdown Layer Position & Visibility */
        .countdown-grid { 
            display: flex; 
            gap: 16px; 
            margin-top: -165px; 
            position: relative;
            z-index: 10; /* Ensures boxes render on top of book cover */
            justify-content: center; 
            width: 100%;
        }
        .time-box { 
            background: #caaa5d; 
            color: #1a1a1a;
            width: 132px; 
            height: 132px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.18); 
        }
        .number { font-size: 2.9rem; font-weight: 700; margin-bottom: 8px; line-height: 1; }
        .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.8px; font-weight: 700; }

        .footer-text { font-size: 1.08rem; color: #222222; line-height: 1.7; margin-top: 38px; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .corner-floral { width: 130px; }
            .header-masks img { width: 142px; }
            .book-container { width: 230px; height: 290px; padding-top: 30px; }
            .book-title { font-size: 1.4rem; }
            .countdown-grid { 
                flex-wrap: wrap; 
                max-width: 360px; 
                gap: 12px; 
                margin-top: -115px; 
                justify-content: center; 
            }
            .time-box { width: 104px; height: 100px; }
            .time-box:nth-child(4), .time-box:nth-child(5) { flex: 0 0 104px; }
            .number { font-size: 2.15rem; }
            .label { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <img src="floral-decor-02.png" alt="" class="corner-floral top-left-floral">
    <img src="floral-decor-02.png" alt="" class="corner-floral top-right-floral">

    <div class="wrapper">
        <div class="header-masks">
            <img src="masks.png" alt="masks">
        </div>
        <h1>Chapter 33: Loading...</h1>
        <p class="subtitle">October 12, 2027. Wherever you are.</p>

        <div class="stage-container">
            <div class="book-container">
                <div class="book-author">POOJA,</div>
                <div class="book-title">UNFILTERED</div>
                <div class="book-vol">VOL. 33</div>
            </div>

            <div class="countdown-grid">
                <div class="time-box">
                    <div class="number" id="months">00</div>
                    <div class="label">Months</div>
                </div>
                <div class="time-box">
                    <div class="number" id="days">00</div>
                    <div class="label">Days</div>
                </div>
                <div class="time-box">
                    <div class="number" id="hours">00</div>
                    <div class="label">Hours</div>
                </div>
                <div class="time-box">
                    <div class="number" id="mins">00</div>
                    <div class="label">Minutes</div>
                </div>
                <div class="time-box">
                    <div class="number" id="secs">00</div>
                    <div class="label">Seconds</div>
                </div>
            </div>
        </div>

        <div class="footer-text">
            <p>The story doesn't end here. A new chapter on its way.</p>
            <p><strong>See you soon readers.</strong></p>
        </div>
    </div>

    <script>
        function updateCountdown() {
            const now = new Date();
            const targetDate = new Date(2027, 9, 12, 0, 0, 0);

            if (now >= targetDate) {
                document.querySelector('.wrapper').innerHTML = '<h1>Chapter 33 Unlocked</h1>';
                return;
            }

            let months = (targetDate.getFullYear() - now.getFullYear()) * 12 + (targetDate.getMonth() - now.getMonth());
            
            let tempDate = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
            if (tempDate > targetDate) {
                months--;
            }

            let anchorDate = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
            let diffMs = targetDate - anchorDate;

            let days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            diffMs -= days * (1000 * 60 * 60 * 24);

            let hours = Math.floor(diffMs / (1000 * 60 * 60));
            diffMs -= hours * (1000 * 60 * 60);

            let minutes = Math.floor(diffMs / (1000 * 60));
            diffMs -= minutes * (1000 * 60);

            let seconds = Math.floor(diffMs / 1000);

            document.getElementById('months').innerText = String(months).padStart(2, '0');
            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('mins').innerText = String(minutes).padStart(2, '0');
            document.getElementById('secs').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
