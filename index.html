<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 33: Loading...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7edd9;
            color: #1a1a1a;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Floral Corners - Blend Mode Removes Background Box */
        .corner-floral {
            position: fixed;
            width: 230px;
            height: 230px;
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: multiply;
        }
        .top-left-floral {
            top: 0;
            left: 0;
        }
        .top-right-floral {
            top: 0;
            right: 0;
            transform: scaleX(-1);
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Scaled Masks */
        .header-masks {
            font-size: 6.5rem;
            margin-bottom: 5px;
            line-height: 1;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        p.subtitle {
            font-size: 1rem;
            color: #333333;
            margin-bottom: 35px;
        }

        /* Stage Container */
        .stage-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 70px; /* Expands gap below book cover */
        }

        /* Book Cover */
        .book-container {
            width: 290px;
            height: 400px;
            background-color: #f3ede2;
            border: 1px solid #dcd3c1;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 50px;
            z-index: 1;
        }
        .book-author {
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            color: #b0934c;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .book-title {
            font-size: 1.85rem;
            font-weight: bold;
            color: #caaa5d;
            letter-spacing: 2px;
            line-height: 1.2;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .book-vol {
            font-size: 0.8rem;
            color: #b0934c;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Shifted Up Countdown Grid */
        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: -210px; /* Moves countdown grid higher up on the book cover */
            z-index: 2;
            width: 100%;
        }
        .time-box {
            background-color: #caaa5d;
            color: #1a1a1a;
            width: 130px;
            height: 130px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
        }
        .number {
            font-size: 3rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            line-height: 1;
            margin-bottom: 8px;
        }
        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
            color: #1a1a1a;
        }

        /* Bottom Footer Text */
        .footer-text {
            font-size: 1.05rem;
            color: #222222;
            line-height: 1.7;
            margin-top: 35px; /* Pushes text down further */
        }

        /* Mobile Adjustment (< 768px) */
        @media (max-width: 768px) {
            .header-masks {
                font-size: 5rem;
            }
            .corner-floral {
                width: 130px;
                height: 130px;
            }
            h1 {
                font-size: 1.75rem;
            }
            .book-container {
                width: 230px;
                height: 330px;
                padding-top: 35px;
            }
            .book-title {
                font-size: 1.4rem;
            }
            .countdown-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                max-width: 360px;
                margin-top: -130px;
            }
            .time-box:nth-child(4) {
                grid-column: 1 / 2;
                margin-left: 50%;
            }
            .time-box:nth-child(5) {
                grid-column: 3 / 4;
                margin-right: 50%;
            }
            .time-box {
                width: 100%;
                height: 100px;
            }
            .number {
                font-size: 2.2rem;
            }
            .label {
                font-size: 0.65rem;
            }
            .stage-container {
                margin-bottom: 50px;
            }
        }
    </style>
</head>
<body>

    <img src="floral-decor.png" alt="" class="corner-floral top-left-floral">
    <img src="floral-decor.png" alt="" class="corner-floral top-right-floral">

    <div class="wrapper">
        <div class="header-masks">🎭</div>
        <h1>Chapter 33: Loading...</h1>
        <p class="subtitle">October 12, 2027. Wherever you are.</p>

        <div class="stage-container">
            <div class="book-container">
                <div class="book-author">POOJA,</div>
                <div class="book-title">UNFILTERED</div>
                <div class="book-vol">VOL. 33</div>
            </div>

            <div class="countdown-grid">
                <div class="time-box">
                    <div class="number" id="months">00</div>
                    <div class="label">Months</div>
                </div>
                <div class="time-box">
                    <div class="number" id="days">00</div>
                    <div class="label">Days</div>
                </div>
                <div class="time-box">
                    <div class="number" id="hours">00</div>
                    <div class="label">Hours</div>
                </div>
                <div class="time-box">
                    <div class="number" id="mins">00</div>
                    <div class="label">Minutes</div>
                </div>
                <div class="time-box">
                    <div class="number" id="secs">00</div>
                    <div class="label">Seconds</div>
                </div>
            </div>
        </div>

        <div class="footer-text">
            <p>The story doesn't end here. A new chapter on its way.</p>
            <p><strong>See you soon readers.</strong></p>
        </div>
    </div>

    <script>
        function updateCountdown() {
            const now = new Date();
            const targetDate = new Date(2027, 9, 12, 0, 0, 0);

            if (now >= targetDate) {
                document.querySelector('.wrapper').innerHTML = '<h1>Chapter 33 Unlocked</h1>';
                return;
            }

            let months = (targetDate.getFullYear() - now.getFullYear()) * 12 + (targetDate.getMonth() - now.getMonth());
            
            let tempDate = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
            if (tempDate > targetDate) {
                months--;
            }

            let anchorDate = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
            let diffMs = targetDate - anchorDate;

            let days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            diffMs -= days * (1000 * 60 * 60 * 24);

            let hours = Math.floor(diffMs / (1000 * 60 * 60));
            diffMs -= hours * (1000 * 60 * 60);

            let minutes = Math.floor(diffMs / (1000 * 60));
            diffMs -= minutes * (1000 * 60);

            let seconds = Math.floor(diffMs / 1000);

            document.getElementById('months').innerText = String(months).padStart(2, '0');
            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('mins').innerText = String(minutes).padStart(2, '0');
            document.getElementById('secs').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
