<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 33: Loading...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f6e8d2;
            color: #1a1a1a;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        /* Floral Corner Elements */
        .floral {
            position: absolute;
            width: 120px;
            height: 120px;
            pointer-events: none;
            opacity: 0.85;
        }
        .floral-top-left {
            top: -20px;
            left: -20px;
        }
        .floral-top-right {
            top: -20px;
            right: -20px;
            transform: scaleX(-1);
        }

        /* Large Mask Header */
        .header-masks {
            font-size: 5rem; /* Doubled size */
            margin-bottom: 10px;
            line-height: 1;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        p.subtitle {
            font-size: 1rem;
            color: #333333;
            margin-bottom: 25px;
        }

        /* Book & Overlay Container */
        .stage-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Book Design matching PPT */
        .book-container {
            width: 280px;
            height: 380px;
            background-color: #f3ede2;
            border: 1px solid #dcd3c1;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 45px;
            z-index: 1;
        }
        .book-author {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #b0934c;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .book-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #caaa5d;
            letter-spacing: 2px;
            line-height: 1.2;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .book-vol {
            font-size: 0.8rem;
            color: #b0934c;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Overlapping Gold Countdown Boxes */
        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: -140px; /* Overlaps directly over the book cover */
            z-index: 2;
            width: 100%;
        }
        .time-box {
            background-color: #caaa5d;
            color: #1a1a1a;
            width: 130px;
            height: 130px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }
        .number {
            font-size: 3rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            line-height: 1;
            margin-bottom: 8px;
        }
        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
            color: #1a1a1a;
        }

        .footer-text {
            font-size: 1rem;
            color: #222222;
            line-height: 1.6;
            margin-top: 35px;
        }

        /* Mobile Adjustment (< 768px) */
        @media (max-width: 768px) {
            .header-masks {
                font-size: 3.8rem;
            }
            h1 {
                font-size: 1.75rem;
            }
            .book-container {
                width: 220px;
                height: 310px;
                padding-top: 30px;
            }
            .book-title {
                font-size: 1.4rem;
            }
            .countdown-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                max-width: 360px;
                margin-top: -90px;
            }
            .time-box:nth-child(4) {
                grid-column: 1 / 2;
                margin-left: 50%;
            }
            .time-box:nth-child(5) {
                grid-column: 3 / 4;
                margin-right: 50%;
            }
            .time-box {
                width: 100%;
                height: 100px;
            }
            .number {
                font-size: 2.2rem;
            }
            .label {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header-masks">🎭</div>
        <h1>Chapter 33: Loading...</h1>
        <p class="subtitle">October 12, 2027. Wherever you are.</p>

        <div class="stage-container">
            <div class="book-container">
                <div class="book-author">POOJA,</div>
                <div class="book-title">UNFILTERED</div>
                <div class="book-vol">VOL. 33</div>
            </div>

            <div class="countdown-grid">
                <div class="time-box">
                    <div class="number" id="months">00</div>
                    <div class="label">Months</div>
                </div>
                <div class="time-box">
                    <div class="number" id="days">00</div>
                    <div class="label">Days</div>
                </div>
                <div class="time-box">
                    <div class="number" id="hours">00</div>
                    <div class="label">Hours</div>
                </div>
                <div class="time-box">
                    <div class="number" id="mins">00</div>
                    <div class="label">Minutes</div>
                </div>
                <div class="time-box">
                    <div class="number" id="secs">00</div>
                    <div class="label">Seconds</div>
                </div>
            </div>
        </div>

        <div class="footer-text">
            <p>The story doesn't end here. A new chapter on its way.</p>
            <p><strong>See you soon readers.</strong></p>
        </div>
    </div>

    <script>
        // Target: October 12, 2027 00:00:00 local time
        const targetDate = new Date(2027, 9, 12, 0, 0, 0).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.querySelector('.wrapper').innerHTML = '<h1>Chapter 33 Unlocked</h1>';
                return;
            }

            const totalSeconds = Math.floor(difference / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const totalDays = Math.floor(totalHours / 24);

            const months = Math.floor(totalDays / 30.4375);
            const days = Math.floor(totalDays % 30.4375);
            const hours = totalHours % 24;
            const minutes = totalMinutes % 60;
            const seconds = totalSeconds % 60;

            document.getElementById('months').innerText = String(months).padStart(2, '0');
            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('mins').innerText = String(minutes).padStart(2, '0');
            document.getElementById('secs').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
